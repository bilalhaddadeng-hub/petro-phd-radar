name: Daily Petroleum PhD Radar

on:
  schedule:
    # يعمل يومياً عند الساعة 08:00 بتوقيت UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Global Scan and Send Telegram Alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OWNER_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily.py
